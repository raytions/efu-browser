services:
  efu-browser:
    build: .
    image: ghcr.io/raytions/efu-browser:latest
    ports:
      - "127.0.0.1:8088:80"
    environment:
      - TZ=Asia/Shanghai
      - SCANS_MODE=demo
    volumes:
      # 仅向 Web 容器只读挂载生成的 EFU 索引目录，不要挂载原始 NAS 目录
      - ./indexes:/app/indexes:ro
      # 可选：挂载自定义运行时配置（取消注释即可启用服务器索引，无需重新打包镜像）
      # - ./deploy/config.example.json:/config/config.json:ro
    restart: unless-stopped