services:
  efu-browser:
    build: .
    image: efu-browser:latest
    ports:
      # 默认绑定本机回环，生产环境请前置带认证的反向代理（Basic Auth / OIDC / Tailscale）
      - "${EFU_HTTP_BIND:-127.0.0.1}:${EFU_HTTP_PORT:-8080}:80"
    environment:
      - TZ=Asia/Shanghai
      - SCANS_MODE=${SCANS_MODE:-demo}
      - SCANS_API_BASE=${SCANS_API_BASE:-/api/scans}
      - SCANS_API_UPSTREAM=http://efu-scanner:3001
    volumes:
      # Web/Nginx 仅只读挂载生成的 EFU 索引目录和配置文件，绝不挂载原始 NAS 目录
      - ${EFU_INDEX_DIR:-./indexes}:/app/indexes:ro
      - ${EFU_CONFIG_FILE:-./deploy/config.example.json}:/config/config.json:ro
    restart: unless-stopped

  # 仅在启用真实扫描模式时启动：docker compose -f docker-compose.env.yml --profile real-scans up -d --build
  efu-scanner:
    profiles: ["real-scans"]
    build:
      context: .
      dockerfile: docker/Dockerfile.scanner
    image: efu-browser-scanner:latest
    # 不向宿主机暴露端口，仅限同 Compose 内部网络由 Nginx 反代访问
    environment:
      - TZ=Asia/Shanghai
      - SCANS_MODE=real
      - SCANS_HOST=0.0.0.0
      - SCANS_PORT=3001
      - SCANS_API_BASE=${SCANS_API_BASE:-/api/scans}
      - SCANS_ALLOW_TRIGGER=${SCANS_ALLOW_TRIGGER:-false}
      - SCANS_ALLOW_MANAGE=${SCANS_ALLOW_MANAGE:-false}
      - SCANS_ALLOWED_ROOTS=${SCANS_ALLOWED_ROOTS:-/mnt/nas}
      - SCANS_TASKS_FILE=${SCANS_TASKS_FILE:-/config/scans.json}
      - SCANS_INDEX_DIR=${SCANS_INDEX_DIR:-/app/indexes}
      - EFU_GDU_BIN=${EFU_GDU_BIN:-/usr/local/bin/gdu}
    volumes:
      # 扫描服务仅对 NAS 源目录只读，仅对受控索引目录可写
      - ${NAS_SOURCE_DIR:-/mnt/nas}:/mnt/nas:ro
      - ${EFU_INDEX_DIR:-./indexes}:/app/indexes:rw
      # 挂载配置目录而非单文件，以便 SCANS_ALLOW_MANAGE=true 时支持原子写回 /config/scans.json
      - ${SCANS_CONFIG_DIR:-./config}:/config:${SCANS_CONFIG_MOUNT_MODE:-ro}
    restart: unless-stopped
