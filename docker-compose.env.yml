services:
  efu-browser:
    build: .
    image: efu-browser:latest
    ports:
      - "8080:80"
    volumes:
      # 仅向 Web 容器只读挂载生成的 EFU 索引目录，不要挂载原始 NAS 目录
      - ${EFU_INDEX_DIR:-./indexes}:/app/indexes:ro
      # 可选：挂载自定义运行时配置
      - ${EFU_CONFIG_FILE:-./config.json}:/usr/share/nginx/html/config.json:ro
    restart: unless-stopped
