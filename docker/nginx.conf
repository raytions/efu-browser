server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # 运行时索引配置禁用强缓存，修改挂载的 config.json 后立即生效
    location = /config.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # 推荐的自托管索引目录：仅只读发布生成的 .efu 文件，禁止目录列表与非 .efu 访问
    location /indexes/ {
        alias /app/indexes/;
        autoindex off;
        location ~* \.efu$ {
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
        }
        location ~ / {
            deny all;
            return 403;
        }
    }

    # 兼容旧部署的 /efu/ 目录映射：同样仅允许 .efu 文件且不强缓存
    location /efu/ {
        alias /app/efu/;
        autoindex off;
        location ~* \.efu$ {
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
        }
        location ~ / {
            deny all;
            return 403;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（协商缓存，便于升级）
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # 安全头部
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
}
